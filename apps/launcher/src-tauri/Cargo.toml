[package]
name = "lyno-hardwired"
description = "LYNO//HARDWIRED — Cyberpunk 2077 build launcher on top of MO2"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "lyno_hardwired_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
lyno-core.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
sysinfo = { version = "0.37", default-features = false, features = ["system"] }
tauri-plugin-log = "2"
tauri-plugin-updater = "2"
tauri-plugin-single-instance = "2"
log = "0.4"
time = { version = "0.3", features = ["formatting", "macros"] }
# Windows Credential Manager; other platforms (dev only) get keyring's in-memory mock store.
keyring = { version = "3", features = ["windows-native"] }
tauri-plugin-dialog = "2"
