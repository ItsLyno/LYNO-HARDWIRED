name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  # Manual run (Actions → CI → Run workflow) also builds a test installer.
  workflow_dispatch:

jobs:
  core:
    name: Core tests + frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p lyno-core -p lyno-pack
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/launcher/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: apps/launcher
      - run: pnpm build
        working-directory: apps/launcher
      # The launcher crate is otherwise only compiled by the Windows build.
      # tauri::generate_context! needs apps/launcher/dist, built just above.
      - run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libsoup-3.0-dev
      - run: cargo clippy -p lyno-hardwired -- -D warnings

  # Signed release installers come from launcher-release.yml; this one is
  # an unsigned test build, only on a manual run.
  windows:
    name: Windows launcher build
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    needs: core
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/launcher/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: apps/launcher
      - run: pnpm tauri build
        working-directory: apps/launcher
      - uses: actions/upload-artifact@v4
        with:
          name: lyno-hardwired-setup
          path: target/release/bundle/nsis/*.exe
