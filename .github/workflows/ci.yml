name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

jobs:
  core:
    name: Core tests + frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p lyno-core -p lyno-pack
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/launcher/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: apps/launcher
      - run: pnpm build
        working-directory: apps/launcher

  windows:
    name: Windows launcher build
    runs-on: windows-latest
    needs: core
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/launcher/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: apps/launcher
      - run: pnpm tauri build
        working-directory: apps/launcher
      - uses: actions/upload-artifact@v4
        with:
          name: lyno-hardwired-setup
          path: target/release/bundle/nsis/*.exe
