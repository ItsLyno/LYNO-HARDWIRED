[workspace]
resolver = "2"
members = ["crates/core", "crates/pack", "apps/launcher/src-tauri"]

[workspace.package]
version = "0.7.3"
edition = "2021"
license = "MIT"
repository = "https://github.com/ItsLyno/LYNO-HARDWIRED"

[workspace.dependencies]
lyno-core = { path = "crates/core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
rust-ini = "0.21"
blake3 = "1"
tempfile = "3"
walkdir = "2"
tar = "0.4"
zstd = { version = "0.13", features = ["zstdmt"] }
ureq = { version = "3", features = ["json"] }
